name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - 'renovate/**'
      - 'github-renovate/**'
  pull_request: null
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Test
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: '["vidavidorra/renovate"]'
  release:
    needs:
      - lint-commit-messages
      - lint
      - build
      - test
    uses: vidavidorra/.github/.github/workflows/release.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
