name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - 'renovate/**'
      - 'github-renovate/**'
  pull_request: null
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Test
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: '["vidavidorra/renovate"]'
  release:
    needs:
      - lint-commit-messages
      - lint
      - build
      - test
    uses: vidavidorra/.github/.github/workflows/release.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
