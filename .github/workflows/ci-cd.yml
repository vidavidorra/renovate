name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - 'renovate/**'
      - 'github-renovate/**'
  pull_request: null
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Test
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: '["vidavidorra/renovate"]'
  release:
    needs:
      - lint-commit-messages
      - lint
      - build
      - test
    uses: vidavidorra/.github/.github/workflows/release.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
